<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusHub — Student Activity Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>
            <div>
                <h2>CampusHub</h2>
                <span>Student Management</span>
            </div>
        </div>

        <nav id="nav" class="sidebar-nav"></nav>

        <div class="sidebar-footer">
            <span>Campus Club System</span>
            <small>v1.0</small>
        </div>

    </aside>

    <!-- Main Content -->
    <section class="main">

        <!-- Top Header -->
        <header class="header">

            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p>Manage clubs, events, students and attendance.</p>
            </div>

            <div class="user-area">
                <span>Acting as</span>
                <select id="me"></select>
            </div>

        </header>

        <!-- Content -->
        <main id="v"></main>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
